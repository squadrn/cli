version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    revive:
      rules:
        # Comments explain why, not what; exported identifiers are not documented by default.
        - name: exported
          disabled: true
        - name: unused-parameter
        - name: var-naming
        - name: error-strings
        - name: error-return
        - name: indent-error-flow

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      # The module path has no dot until the repo is published; without this, gofumpt treats sprawling-agents/... as stdlib.
      module-path: sprawling-agents
    goimports:
      local-prefixes:
        - sprawling-agents
