name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.15
      - name: shellcheck
        run: sudo apt-get install -y -qq shellcheck && shellcheck -s sh plugin/bin/sprawl-hook scripts/*.sh .githooks/*
      - name: go mod tidy
        run: go mod tidy -diff
      # Windows-only files are compiled and linted on every change, without a Windows runner.
      - name: install.ps1 is ASCII and passes PSScriptAnalyzer
        shell: pwsh
        run: |
          if ((Get-Content -Raw scripts/install.ps1) -match '[^\x00-\x7F]') { throw "install.ps1 must be ASCII (Windows PowerShell 5.1)" }
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser
          $issues = Invoke-ScriptAnalyzer -Path scripts/install.ps1 -Severity Error,Warning -ExcludeRule PSAvoidUsingWriteHost
          $issues | Format-Table -AutoSize
          if ($issues) { exit 1 }
      - name: vet and lint for Windows
        run: GOOS=windows go vet ./...
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        env:
          GOOS: windows
        with:
          version: v2.15

  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Commit messages (Conventional Commits, no AI attribution)
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE" ]; then
            range="$BASE..$HEAD_SHA"
          elif [ -n "$BEFORE" ] && ! printf '%s' "$BEFORE" | grep -q '^0*$' && git cat-file -e "$BEFORE" 2>/dev/null; then
            range="$BEFORE..$HEAD_SHA"
          else
            range="$HEAD_SHA" # first push or force push: the whole history
          fi
          scripts/commitlint.sh --range "$range"

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Install tmux
        run: if [ "$RUNNER_OS" = Linux ]; then sudo apt-get install -y -qq tmux; else brew install tmux; fi
      - name: Test
        run: go test -race ./...
      - name: Coverage gates
        run: make cover-gates

  # The oldest supported Git is 2.31; Debian 11 ships 2.30. sprawl must say so and name the
  # upgrade, not fail with a raw git error.
  git-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - run: CGO_ENABLED=0 go build -o sprawl ./cmd/sprawl
      - name: Debian 11 (Git 2.30) gets the upgrade message
        run: |
          docker run --rm -v "$PWD/sprawl:/usr/local/bin/sprawl:ro" debian:11 sh -ec '
            # Debian 11 is end of life: its packages live on archive.debian.org.
            printf "%s\n" "deb http://archive.debian.org/debian bullseye main" \
              "deb http://archive.debian.org/debian-security bullseye-security main" >/etc/apt/sources.list
            apt-get -o Acquire::Check-Valid-Until=false update -qq && apt-get install -y -qq git >/dev/null
            git version
            git init -q /tmp/r && cd /tmp/r
            if sprawl wt ls 2>/tmp/err; then echo "expected a refusal"; exit 1; fi
            cat /tmp/err
            grep -q "is too old; sprawl needs git 2.31 or newer" /tmp/err
            grep -q "bullseye-backports" /tmp/err'

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      # Defender scanning every test binary makes Windows tests slow and flaky.
      - name: Exclude the workspace from Defender
        shell: pwsh
        run: Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, (go env GOCACHE)
      - name: Test
        run: go test ./...
      - name: Coverage gates
        shell: bash
        run: COVER_GATES="$(sed -n 's/^COVER_GATES_WINDOWS := //p' Makefile)" scripts/cover-gates.sh
      - name: Install, update, rollback and uninstall on Windows
        shell: pwsh
        run: ./scripts/windows-e2e.ps1
      # The documented script block against a release built here and served by a fake gh.
      - name: install.ps1 as documented, in Windows PowerShell 5.1 and PowerShell 7
        shell: bash
        run: |
          fixture="$RUNNER_TEMP/ps1-fixture"
          mkdir -p "$fixture"
          ssh-keygen -q -t ed25519 -N '' -C test -f "$fixture/key"
          sh scripts/render-install.sh test/sprawl-releases v1.2.0-rc.99 "$fixture/key.pub"
          pwsh -NoProfile -File scripts/windows-install-e2e.ps1 -Fixture "$(cygpath -w "$fixture")" -Tag v1.2.0-rc.99
      - name: install.ps1 parses in Windows PowerShell 5.1 and PowerShell 7
        run: |
          powershell -NoProfile -Command '$null = [scriptblock]::Create((Get-Content -Raw scripts/install.ps1)); "5.1 ok"'
          pwsh -NoProfile -Command '$null = [scriptblock]::Create((Get-Content -Raw scripts/install.ps1)); "7 ok"'

  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: "~> v2"
          args: check
        env:
          SPRAWL_RELEASES_OWNER: check
          SPRAWL_RELEASES_NAME: check
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      # Archive names and contents are a contract with installed copies (ADR 0008).
      - name: Release archives match testdata/release-assets.golden
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish,sign,sbom
        env:
          SPRAWL_RELEASES_OWNER: check
          SPRAWL_RELEASES_NAME: check
      - run: scripts/release-assets.sh dist | diff -u testdata/release-assets.golden -
