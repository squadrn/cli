name: ci

# Docs-only changes skip these jobs; commit messages are checked by commits.yml on every change.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE", "NOTICE", ".github/ISSUE_TEMPLATE/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE", "NOTICE", ".github/ISSUE_TEMPLATE/**"]
  workflow_call:

permissions:
  contents: read

# A newer push to a branch or PR cancels the older run; a release (workflow_call from a tag)
# always runs to the end.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15
      - name: shellcheck
        run: sudo apt-get install -y -qq shellcheck && shellcheck -s sh plugin/bin/squadrn-hook scripts/*.sh .githooks/*
      - name: go mod tidy
        run: go mod tidy -diff
      # Windows-only files are compiled and linted on every change, without a Windows runner.
      - name: install.ps1 is ASCII and passes PSScriptAnalyzer
        shell: pwsh
        run: |
          if ((Get-Content -Raw scripts/install.ps1) -match '[^\x00-\x7F]') { throw "install.ps1 must be ASCII (Windows PowerShell 5.1)" }
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser
          $issues = Invoke-ScriptAnalyzer -Path scripts/install.ps1 -Severity Error,Warning -ExcludeRule PSAvoidUsingWriteHost
          $issues | Format-Table -AutoSize
          if ($issues) { exit 1 }
      - name: vet and lint for Windows
        run: GOOS=windows go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOOS: windows
        with:
          version: v2.15

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Install tmux
        run: if [ "$RUNNER_OS" = Linux ]; then sudo apt-get install -y -qq tmux; else brew install tmux; fi
      - name: Test
        run: go test -race ./...
      - name: Coverage gates
        run: make cover-gates

  # The oldest supported Git is 2.31; Debian 11 ships 2.30. squadrn must say so and name the
  # upgrade, not fail with a raw git error.
  git-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: CGO_ENABLED=0 go build -o squadrn ./cmd/squadrn
      - name: Debian 11 (Git 2.30) gets the upgrade message
        run: |
          docker run --rm -v "$PWD/squadrn:/usr/local/bin/squadrn:ro" debian:11 sh -ec '
            # Debian 11 is end of life: its packages live on archive.debian.org.
            printf "%s\n" "deb http://archive.debian.org/debian bullseye main" \
              "deb http://archive.debian.org/debian-security bullseye-security main" >/etc/apt/sources.list
            apt-get -o Acquire::Check-Valid-Until=false update -qq && apt-get install -y -qq git >/dev/null
            git version
            git init -q /tmp/r && cd /tmp/r
            if squadrn wt ls 2>/tmp/err; then echo "expected a refusal"; exit 1; fi
            cat /tmp/err
            grep -q "is too old; squadrn needs git 2.31 or newer" /tmp/err
            grep -q "bullseye-backports" /tmp/err'

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # Defender scanning every test binary makes Windows tests slow and flaky.
      - name: Exclude the workspace from Defender
        shell: pwsh
        run: Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, (go env GOCACHE)
      - name: Test
        run: go test ./...
      - name: Coverage gates
        shell: bash
        run: COVER_GATES="$(sed -n 's/^COVER_GATES_WINDOWS := //p' Makefile)" scripts/cover-gates.sh
      - name: Install, update, rollback and uninstall on Windows
        shell: pwsh
        run: ./scripts/windows-e2e.ps1
      # The documented commands against a release built here, from a local release directory.
      - name: install.ps1 as documented, in Windows PowerShell 5.1 and PowerShell 7
        shell: bash
        run: |
          fixture="$RUNNER_TEMP/ps1-fixture"
          mkdir -p "$fixture"
          ssh-keygen -q -t ed25519 -N '' -C test -f "$fixture/key"
          sh scripts/render-install.sh squadrn/cli v1.2.0-rc.99 "$fixture/key.pub"
          pwsh -NoProfile -File scripts/windows-install-e2e.ps1 -Fixture "$(cygpath -w "$fixture")" -Tag v1.2.0-rc.99
      - name: install.ps1 parses in Windows PowerShell 5.1 and PowerShell 7
        run: |
          powershell -NoProfile -Command '$null = [scriptblock]::Create((Get-Content -Raw scripts/install.ps1)); "5.1 ok"'
          pwsh -NoProfile -Command '$null = [scriptblock]::Create((Get-Content -Raw scripts/install.ps1)); "7 ok"'

  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.2
          args: check
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # Archive names and contents are a contract with installed copies (ADR 0008).
      - name: Release archives match testdata/release-assets.golden
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.2
          args: release --snapshot --clean --skip=publish,sign,sbom
      - run: scripts/release-assets.sh dist | diff -u testdata/release-assets.golden -
