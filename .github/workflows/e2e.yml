name: e2e

# The end-to-end smoke run (make e2e, e2e/README.md): the real installer into a sandbox, then the
# main flows with fake agent CLIs, on each supported OS. Separate from the unit and script tests.
on:
  push:
    branches: [main]
    paths: &paths
      - "cmd/**"
      - "internal/**"
      - "scripts/**"
      - "plugin/**"
      - ".claude-plugin/**"
      - "e2e/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".github/workflows/e2e.yml"
  pull_request:
    paths: *paths

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Install tmux
        if: runner.os != 'Windows'
        run: if [ "$RUNNER_OS" = Linux ]; then sudo apt-get install -y -qq tmux; else brew install tmux; fi
      # Defender scanning every built binary makes Windows runs slow and flaky.
      - name: Exclude the workspace from Defender
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, (go env GOCACHE)
      - name: make e2e
        shell: bash
        run: make e2e
