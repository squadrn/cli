name: maintenance

# Monthly check of what releases depend on. A failed run makes GitHub email the owner, so a
# signing key that no longer matches is noticed before a release needs it.
on:
  schedule:
    - cron: "0 3 1 * *" # 03:00 UTC on the 1st of every month
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signing-key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: SQUADRN_SIGNING_KEY matches a key in signers.pub
        env:
          SQUADRN_SIGNING_KEY: ${{ secrets.SQUADRN_SIGNING_KEY }}
        run: |
          [ -n "$SQUADRN_SIGNING_KEY" ] || { echo "::error::secret SQUADRN_SIGNING_KEY is not set (docs/maintaining.md)"; exit 1; }
          umask 077
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SQUADRN_SIGNING_KEY" >"$key"
          pub=$(ssh-keygen -y -f "$key" | awk '{print $2}') || { echo "::error::SQUADRN_SIGNING_KEY is not a valid private key"; exit 1; }
          if awk '$1 == "ssh-ed25519" {print $2}' internal/release/signers.pub | grep -qxF "$pub"; then
            echo "signing key matches internal/release/signers.pub"
          else
            echo "::error::SQUADRN_SIGNING_KEY is not in internal/release/signers.pub; releases would be refused (docs/maintaining.md)"
            exit 1
          fi
