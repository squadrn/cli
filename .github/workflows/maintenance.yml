name: maintenance

# Monthly check of what releases depend on. A failed run makes GitHub email the owner, so an
# expiring token or a signing key that no longer matches is noticed before a release needs it.
on:
  schedule:
    - cron: "0 3 1 * *" # 03:00 UTC on the 1st of every month
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-secrets:
    runs-on: ubuntu-latest
    env:
      RELEASES_REPO: ${{ vars.SPRAWL_RELEASES_REPO }}
      WARN_DAYS: 21
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: SPRAWL_RELEASES_TOKEN can reach the releases repository and is not about to expire
        env:
          GH_TOKEN: ${{ secrets.SPRAWL_RELEASES_TOKEN }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::error::secret SPRAWL_RELEASES_TOKEN is not set (docs/maintaining.md)"; exit 1; }
          headers=$(gh api -i "repos/$RELEASES_REPO" 2>&1) || { echo "::error::SPRAWL_RELEASES_TOKEN cannot read $RELEASES_REPO: expired or revoked (docs/maintaining.md)"; exit 1; }
          expiry=$(printf '%s\n' "$headers" | tr -d '\r' | sed -n 's/^github-authentication-token-expiration: //Ip' | head -n 1)
          if [ -z "$expiry" ]; then
            echo "token has no expiry date"
            exit 0
          fi
          days=$(( ($(date -d "$expiry" +%s) - $(date +%s)) / 86400 ))
          echo "SPRAWL_RELEASES_TOKEN expires $expiry ($days days)"
          if [ "$days" -lt "$WARN_DAYS" ]; then
            echo "::error::SPRAWL_RELEASES_TOKEN expires in $days days; renew it (docs/maintaining.md)"
            exit 1
          fi
      - name: SPRAWL_SIGNING_KEY matches a key in signers.pub
        env:
          SPRAWL_SIGNING_KEY: ${{ secrets.SPRAWL_SIGNING_KEY }}
        run: |
          [ -n "$SPRAWL_SIGNING_KEY" ] || { echo "::error::secret SPRAWL_SIGNING_KEY is not set (docs/maintaining.md)"; exit 1; }
          umask 077
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SPRAWL_SIGNING_KEY" >"$key"
          pub=$(ssh-keygen -y -f "$key" | awk '{print $2}') || { echo "::error::SPRAWL_SIGNING_KEY is not a valid private key"; exit 1; }
          if awk '$1 == "ssh-ed25519" {print $2}' internal/release/signers.pub | grep -qxF "$pub"; then
            echo "signing key matches internal/release/signers.pub"
          else
            echo "::error::SPRAWL_SIGNING_KEY is not in internal/release/signers.pub; releases would be refused (docs/maintaining.md)"
            exit 1
          fi
