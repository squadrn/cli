name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The full CI matrix (Linux amd64/arm64, macOS, Windows) must pass before anything is published.
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release in this repository
      id-token: write # sign build provenance
      attestations: write # store build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: Signing key present
        run: grep -q '^ssh-ed25519 ' internal/release/signers.pub || { echo "no signing key in internal/release/signers.pub (scripts/release-key.sh)"; exit 1; }
      # Outside the checkout: GoReleaser refuses to release from a dirty tree.
      - name: Release notes from CHANGELOG.md
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "## " v " ") == 1 || $0 == "## " v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md >"$RUNNER_TEMP/release-notes.md"
          [ -s "$RUNNER_TEMP/release-notes.md" ] || { echo "CHANGELOG.md has no section for $version"; exit 1; }
      # Published as a draft: users see it only after the upgrade jobs pass (publish job).
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.2
          args: release --clean --release-notes ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SQUADRN_SIGNING_KEY: ${{ secrets.SQUADRN_SIGNING_KEY }}
      # Provenance where GitHub supports it (public repositories, Enterprise Cloud); the signature
      # above is what installs rely on.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        continue-on-error: true
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

  # The real upgrade path, against the draft: install the previous release with this release's
  # installer, then self-update to this one (and roll back on Linux). Only a token with push
  # access sees drafts, hence contents: write; nothing here writes. Skipped without a previous
  # release.
  upgrade:
    needs: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      SQUADRN_NO_UPDATE_CHECK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Previous release (semver, same channel)
        id: prev
        shell: bash
        run: |
          prev=$(gh release list --repo "$REPO" --limit 100 --json tagName,isPrerelease,isDraft |
            jq -r -f scripts/previous-release.jq)
          echo "tag=$prev" >>"$GITHUB_OUTPUT"
          echo "previous release: ${prev:-none}"
      - name: Install the previous release, update, roll back (Linux)
        if: steps.prev.outputs.tag != '' && runner.os == 'Linux'
        env:
          PREV: ${{ steps.prev.outputs.tag }}
        run: |
          gh release download "$TAG" -R "$REPO" -p install.sh -O install.sh
          sh install.sh --version "$PREV" --command squadrn --alias ''
          export PATH="$HOME/.local/bin:$PATH"
          squadrn version
          squadrn self-update --tag "$TAG"
          test "$(squadrn version)" = "squadrn ${TAG#v}"
          squadrn doctor --json >/dev/null || true
          squadrn self-update --rollback
          test "$(squadrn version)" = "squadrn ${PREV#v}"
          squadrn self-update --rollback
          test "$(squadrn version)" = "squadrn ${TAG#v}"
      - name: Install the previous release and update (Windows)
        if: steps.prev.outputs.tag != '' && runner.os == 'Windows'
        shell: pwsh
        env:
          PREV: ${{ steps.prev.outputs.tag }}
        run: |
          gh release download $env:TAG -R $env:REPO -p install.ps1 -O install.ps1
          ./install.ps1 -Version $env:PREV -Name squadrn -Alias ''
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 failed" }
          $squadrn = Join-Path $env:USERPROFILE ".local\bin\squadrn.exe"
          & $squadrn version
          & $squadrn self-update --tag $env:TAG
          if ((& $squadrn version) -ne "squadrn $($env:TAG.TrimStart('v'))") { throw "self-update did not reach $env:TAG" }

  # Only a release whose upgrade path works becomes visible to users.
  publish:
    needs: upgrade
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Publish the draft
        run: gh release edit "$TAG" --repo "$REPO" --draft=false

  # After publishing: an install on the release's channel discovers it.
  discover:
    needs: publish
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      SQUADRN_NO_UPDATE_CHECK: "1"
    steps:
      - name: The one-line installer and self-update --check see the release on its channel
        run: |
          curl -fsSL "https://github.com/$REPO/releases/download/$TAG/install.sh" | sh -s -- --command squadrn --alias ''
          export PATH="$HOME/.local/bin:$PATH"
          case $TAG in *-*) want=beta ;; *) want=stable ;; esac
          test "$(squadrn config get update_channel)" = "$want"
          squadrn self-update --check --json | tee check.json
          test "$(jq -r .latest check.json)" = "$TAG"
          test "$(jq -r .channel check.json)" = "$want"
