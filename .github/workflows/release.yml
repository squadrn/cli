name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The full CI matrix (Linux amd64/arm64, macOS) must pass before anything is published.
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # sign build provenance
      attestations: write # store build provenance
    env:
      # owner/name of the binaries-only repository users install from (repository variable).
      RELEASES_REPO: ${{ vars.SPRAWL_RELEASES_REPO }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - uses: anchore/sbom-action/download-syft@da167eac915b4e86f08b264dbdbc867b61be6f0c # v0.20.5
      - name: Release settings
        run: |
          case "$RELEASES_REPO" in */*) ;; *) echo "set the repository variable SPRAWL_RELEASES_REPO (owner/name)"; exit 1 ;; esac
          grep -q '^ssh-ed25519 ' internal/release/signers.pub || { echo "no signing key in internal/release/signers.pub (scripts/release-key.sh)"; exit 1; }
          {
            echo "SPRAWL_RELEASES_OWNER=${RELEASES_REPO%%/*}"
            echo "SPRAWL_RELEASES_NAME=${RELEASES_REPO#*/}"
          } >>"$GITHUB_ENV"
      # Outside the checkout: GoReleaser refuses to release from a dirty tree.
      - name: Release notes from CHANGELOG.md
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "## " v " ") == 1 || $0 == "## " v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md >"$RUNNER_TEMP/release-notes.md"
          [ -s "$RUNNER_TEMP/release-notes.md" ] || { echo "CHANGELOG.md has no section for $version"; exit 1; }
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: "~> v2"
          args: release --clean --release-notes ${{ runner.temp }}/release-notes.md
        env:
          # Fine-grained token with contents:write on the releases repository only.
          GITHUB_TOKEN: ${{ secrets.SPRAWL_RELEASES_TOKEN }}
          SPRAWL_SIGNING_KEY: ${{ secrets.SPRAWL_SIGNING_KEY }}
      # Provenance where GitHub supports it (public repositories, Enterprise Cloud); the signature
      # above is what installs rely on.
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        continue-on-error: true
        with:
          subject-path: |
            dist/*.tar.gz
            dist/checksums.txt
