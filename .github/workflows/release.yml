name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The full CI matrix (Linux amd64/arm64, macOS, Windows) must pass before anything is published.
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # sign build provenance
      attestations: write # store build provenance
    env:
      # owner/name of the binaries-only repository users install from (repository variable).
      RELEASES_REPO: ${{ vars.SPRAWL_RELEASES_REPO }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - uses: anchore/sbom-action/download-syft@da167eac915b4e86f08b264dbdbc867b61be6f0c # v0.20.5
      - name: Release settings
        run: |
          case "$RELEASES_REPO" in */*) ;; *) echo "set the repository variable SPRAWL_RELEASES_REPO (owner/name)"; exit 1 ;; esac
          grep -q '^ssh-ed25519 ' internal/release/signers.pub || { echo "no signing key in internal/release/signers.pub (scripts/release-key.sh)"; exit 1; }
          {
            echo "SPRAWL_RELEASES_OWNER=${RELEASES_REPO%%/*}"
            echo "SPRAWL_RELEASES_NAME=${RELEASES_REPO#*/}"
          } >>"$GITHUB_ENV"
      # Outside the checkout: GoReleaser refuses to release from a dirty tree.
      - name: Release notes from CHANGELOG.md
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "## " v " ") == 1 || $0 == "## " v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md >"$RUNNER_TEMP/release-notes.md"
          [ -s "$RUNNER_TEMP/release-notes.md" ] || { echo "CHANGELOG.md has no section for $version"; exit 1; }
      # Published as a draft: users see it only after the upgrade jobs pass (publish job).
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: v2.20.2
          args: release --clean --release-notes ${{ runner.temp }}/release-notes.md
        env:
          # Fine-grained token with contents:write on the releases repository only.
          GITHUB_TOKEN: ${{ secrets.SPRAWL_RELEASES_TOKEN }}
          SPRAWL_SIGNING_KEY: ${{ secrets.SPRAWL_SIGNING_KEY }}
      # Provenance where GitHub supports it (public repositories, Enterprise Cloud); the signature
      # above is what installs rely on.
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        continue-on-error: true
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

  # The real upgrade path, against the draft: install the previous release with this release's
  # installer, then self-update to this one (and roll back on Linux). Drafts are visible to the
  # publishing token only, so it is used here (read-only otherwise). Skipped without a previous
  # release.
  upgrade:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ secrets.SPRAWL_RELEASES_TOKEN }}
      RELEASES_REPO: ${{ vars.SPRAWL_RELEASES_REPO }}
      TAG: ${{ github.ref_name }}
      SPRAWL_NO_UPDATE_CHECK: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Previous release (semver, same channel)
        id: prev
        shell: bash
        run: |
          prev=$(gh release list --repo "$RELEASES_REPO" --limit 100 --json tagName,isPrerelease,isDraft |
            jq -r -f scripts/previous-release.jq)
          # The first Windows release has no Windows predecessor to update from.
          if [ -n "$prev" ] && [ "$RUNNER_OS" = Windows ]; then
            zips=$(gh release view "$prev" --repo "$RELEASES_REPO" --json assets --jq '[.assets[].name | select(endswith(".zip"))] | length')
            [ "$zips" -gt 0 ] || prev=""
          fi
          echo "tag=$prev" >>"$GITHUB_OUTPUT"
          echo "previous release: ${prev:-none}"
      - name: Install the previous release, update, roll back (Linux)
        if: steps.prev.outputs.tag != '' && runner.os == 'Linux'
        env:
          PREV: ${{ steps.prev.outputs.tag }}
        run: |
          gh release download "$TAG" -R "$RELEASES_REPO" -p install.sh -O install.sh
          sh install.sh --version "$PREV" --name sprawl --alias ''
          export PATH="$HOME/.local/bin:$PATH"
          sprawl version
          sprawl self-update --version "$TAG"
          test "$(sprawl version)" = "sprawl ${TAG#v}"
          sprawl doctor --json >/dev/null || true
          sprawl self-update --rollback
          test "$(sprawl version)" = "sprawl ${PREV#v}"
          sprawl self-update --rollback
          test "$(sprawl version)" = "sprawl ${TAG#v}"
      - name: Install the previous release and update (Windows)
        if: steps.prev.outputs.tag != '' && runner.os == 'Windows'
        shell: pwsh
        env:
          PREV: ${{ steps.prev.outputs.tag }}
        run: |
          gh release download $env:TAG -R $env:RELEASES_REPO -p install.ps1 -O install.ps1
          ./install.ps1 -Version $env:PREV -Name sprawl -Alias ''
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 failed" }
          $sprawl = Join-Path $env:USERPROFILE ".local\bin\sprawl.exe"
          & $sprawl version
          & $sprawl self-update --version $env:TAG
          if ((& $sprawl version) -ne "sprawl $($env:TAG.TrimStart('v'))") { throw "self-update did not reach $env:TAG" }

  # Only a release whose upgrade path works becomes visible to users.
  publish:
    needs: upgrade
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.SPRAWL_RELEASES_TOKEN }}
      RELEASES_REPO: ${{ vars.SPRAWL_RELEASES_REPO }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Publish the draft
        run: gh release edit "$TAG" --repo "$RELEASES_REPO" --draft=false

  # After publishing: an install on the release's channel discovers it.
  discover:
    needs: publish
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.SPRAWL_RELEASES_TOKEN }}
      RELEASES_REPO: ${{ vars.SPRAWL_RELEASES_REPO }}
      TAG: ${{ github.ref_name }}
      SPRAWL_NO_UPDATE_CHECK: "1"
    steps:
      - name: self-update --check sees the release on its channel
        run: |
          gh release download "$TAG" -R "$RELEASES_REPO" -p install.sh -O install.sh
          sh install.sh --name sprawl --alias ''
          export PATH="$HOME/.local/bin:$PATH"
          case $TAG in *-*) want=beta ;; *) want=stable ;; esac
          test "$(sprawl config get update_channel)" = "$want"
          sprawl self-update --check --json | tee check.json
          test "$(jq -r .latest check.json)" = "$TAG"
          test "$(jq -r .channel check.json)" = "$want"
