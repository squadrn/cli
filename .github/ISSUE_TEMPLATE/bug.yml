name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, what happened instead (with the error message).
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. squadrn …
        2. …
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: squadrn version and doctor
      description: Output of `squadrn version` and `squadrn doctor` (remove anything private).
      render: text
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: macOS 15 arm64 / Ubuntu 24.04 / Windows 11, Claude Code 2.x
    validations:
      required: true
  - type: markdown
    attributes:
      value: Security problems go to a private report instead (see SECURITY.md).
